# Cada push a main entra al VPS compartido (Contabo) y actualiza Centralizador.
#
# Usa una llave SSH restringida (ver deploy/README.md, seccion 4): en el VPS,
# esa llave tiene un "command=" forzado en authorized_keys que SOLO permite
# `git pull --ff-only && docker compose up -d --build` en /srv/centralizador.
# El "script" de abajo es informativo - lo que de verdad se ejecuta lo decide
# el VPS, no este workflow, aunque alguien edite este archivo.
#
# Se puede apagar sin tocar secretos: Settings -> Secrets and variables ->
# Actions -> Variables -> VPS_DEPLOY_ACTIVO en "false" (o borrarla).
name: Deploy a VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.VPS_DEPLOY_ACTIVO == 'true'
    steps:
      - name: Deploy por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/centralizador && git pull --ff-only && cd deploy && docker compose up -d --build && docker image prune -f
