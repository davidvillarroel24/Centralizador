{% extends 'web/base.html' %}
{% block title %}Iniciar sesión - Centralizador{% endblock %}
{% block header %}Iniciar sesión{% endblock %}
{% block content %}
  <div style="max-width:480px; margin:20px auto;">
    {% if error %}
      <div style="background:#f8d7da; border:1px solid #f5c6cb; padding:12px; border-radius:4px; color:#721c24; margin-bottom:16px;">
        {{ error }}
      </div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:12px;">
        <label for="username">Usuario (nombre de docente)</label><br>
        <input id="username" name="username" type="text" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;" required>
      </div>
      <div style="margin-bottom:12px;">
        <label for="password">Contraseña</label><br>
        <input id="password" name="password" type="password" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;" required>
      </div>
      <button type="submit" style="padding:10px 16px; background:#d9a441; color:#151005; border:none; border-radius:4px; cursor:pointer;">Entrar</button>
    </form>
    <p style="margin-top:16px;">¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate</a></p>
  </div>
{% endblock %}
